plugins {
    id 'com.android.application'
}

android {
    namespace 'com.respect.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.respect.app'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '0.2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
