name: Build Respect Expo APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: respect-app/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006'

      - name: Install dependencies
        working-directory: ./respect-app
        run: npm ci

      - name: Test domain and persistence
        working-directory: ./respect-app
        run: npm run check

      - name: Generate native Android project
        working-directory: ./respect-app
        run: npx expo prebuild --platform android --no-install

      - name: Build debug APK
        working-directory: ./respect-app/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: respect-expo-debug-apk
          path: respect-app/android/app/build/outputs/apk/debug/app-debug.apk
